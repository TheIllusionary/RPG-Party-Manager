name: Release Electron App

# Publishes a new installer to GitHub Releases so installed apps auto-update via electron-updater.
# - Push to main (webapp changes) → version 1.0.<run_number>
# - Push tag v* → version from tag (e.g. v1.2.0 → 1.2.0)

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --prefix webapp
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Install API production dependencies
        run: npm install --prefix api --omit=dev

      - name: Build frontend
        run: npm run build --prefix webapp

      - name: Build & publish to GitHub Releases
        working-directory: webapp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: PartyManager-Windows-${{ env.APP_VERSION }}
          path: |
            webapp/dist-electron/PartyManager-Setup-*.exe
            webapp/dist-electron/latest.yml
          if-no-files-found: error
