name: Release Electron App

# Builds in the private source repo and publishes installers to the public releases repo:
# https://github.com/GuilhermeDanzer/RPG-Party-Manager-Releases
#
# Requires secret RELEASES_REPO_TOKEN (PAT with repo scope) on the source repo.
# - Push to main (webapp changes) → version 1.0.<run_number>
# - Push tag v* → version from tag (e.g. v1.2.0 → 1.2.0)

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-release
  cancel-in-progress: true

env:
  RELEASES_REPO: GuilhermeDanzer/RPG-Party-Manager-Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            webapp/package-lock.json

      - name: Validate tag version matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./webapp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION). Please bump the version in package.json before tagging."
            exit 1
          fi

      - name: Set release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Release version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --prefix webapp
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          npm install --prefix api --omit=dev
          npm install --prefix webapp

      - name: Build frontend
        run: npm run build --prefix webapp

      - name: Build Electron services (document store, Player View WS)
        run: npm run build:electron-services --prefix webapp

      - name: Build & publish to public releases repo (if token available)
        if: "${{ secrets.RELEASES_REPO_TOKEN != '' }}"
        working-directory: webapp
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Build Electron App without publishing (if token unavailable)
        if: "${{ secrets.RELEASES_REPO_TOKEN == '' }}"
        working-directory: webapp
        run: npx electron-builder --win --publish never

      - name: Prepare installer assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem "webapp/dist-electron/PartyManager-Setup-*.exe" |
            Where-Object { $_.Name -ne 'PartyManager-Setup.exe' } |
            Select-Object -First 1
          if (-not $installer) { throw "Versioned installer not found." }
          $fixed = "webapp/dist-electron/PartyManager-Setup.exe"
          Copy-Item $installer.FullName $fixed -Force

      - name: Upload installers to public releases repo
        if: "${{ secrets.RELEASES_REPO_TOKEN != '' }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $installer = Get-ChildItem "webapp/dist-electron/PartyManager-Setup-*.exe" |
            Where-Object { $_.Name -ne 'PartyManager-Setup.exe' } |
            Select-Object -First 1
          $fixed = "webapp/dist-electron/PartyManager-Setup.exe"
          gh release upload $tag $fixed $installer.FullName "webapp/dist-electron/latest.yml" --repo $env:RELEASES_REPO --clobber

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: PartyManager-Windows-${{ env.APP_VERSION }}
          path: |
            webapp/dist-electron/PartyManager-Setup-*.exe
            webapp/dist-electron/PartyManager-Setup.exe
            webapp/dist-electron/latest.yml
          if-no-files-found: error
